<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digilibra - Biblioteca Digital</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav>
        <h1>Digilibra</h1>
        <div class="nav-links">
            <button onclick="navigate('books')">Livros</button>
            <button onclick="navigate('authors')">Autores</button>
        </div>
    </nav>

    <main id="app">
        <section id="view-books" class="view-section active">
            <h2>Gerenciamento de Livros</h2>

            <div class="controls-panel" style="background-color: #e0f2fe;">
                <div class="input-group">
                    <label>Nome do Livro:</label>
                    <input type="text" id="b-name" placeholder="Ex: Como Treinar Bíceps">
                </div>
                <div class="input-group">
                    <label>ID do Autor:</label>
                    <input type="number" id="b-author-id" placeholder="Ex: 1">
                </div>
                <div class="input-group">
                    <label>Quantidade:</label>
                    <input type="number" id="b-quantity" placeholder="10">
                </div>
                <div class="input-group">
                    <label>Valor (R$):</label>
                    <input type="number" step="0.01" id="b-value" placeholder="289.60">
                </div>
                <div class="input-group">
                    <label>Data de lançamento:</label>
                    <input type="date" id="b-release-date">
                </div>
                <button class="btn btn-success" onclick="addBook()">Adicionar Livro</button>
            </div>

            <div class="controls-panel">
                <div class="input-group">
                    <label>Buscar Livro (Nome exato)</label>
                    <input type="text" id="search-b-name">
                </div>
                <div class="input-group">
                    <label>ID do Autor para busca</label>
                    <input type="number" id="search-b-author">
                </div>
                <button class="btn" onclick="searchBook()">Buscar Unitário</button>
                <button class="btn" style="background: #64748b;" onclick="loadBooks()">Limpar / Recarregar
                    Todos</button>
            </div>

            <div class="grid" id="books-grid"></div>
        </section>

        <section id="view-authors" class="view-section">
            <h2>Gerenciamento de Autores</h2>

            <div class="controls-panel" style="background-color: #e0f2fe;">
                <div class="input-group">
                    <label>Nome do Novo Autor</label>
                    <input type="text" id="a-name" placeholder="Ex: Rafael V. Martins">
                </div>
                <button class="btn btn-success" onclick="addAuthor()">Adicionar Autor</button>
            </div>

            <div class="controls-panel">
                <div class="input-group">
                    <label>Buscar Autor (Por ID)</label>
                    <input type="number" id="search-a-id" placeholder="ID do Autor">
                </div>
                <button class="btn" onclick="searchAuthor()">Buscar Unitário</button>
                <button class="btn" style="background: #64748b;" onclick="loadAuthors()">Limpar / Recarregar
                    Todos</button>
            </div>

            <div class="grid" id="authors-grid"></div>
        </section>
    </main>

    <div id="update-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color: var(--primary); margin-bottom: 0.5rem;">Atualizar Livro</h3>

            <input type="hidden" id="upd-id">

            <div class="input-group">
                <label>Nome do Livro:</label>
                <input type="text" id="upd-name">
            </div>
            <div class="input-group">
                <label>Valor (R$):</label>
                <input type="number" step="0.01" id="upd-value">
            </div>
            <div class="input-group">
                <label>Quantidade:</label>
                <input type="number" id="upd-quantity">
            </div>
            <div class="input-group">
                <label>Lançamento:</label>
                <input type="date" id="upd-release-date">
            </div>

            <div class="modal-actions">
                <button class="btn" style="background: #64748b;" onclick="closeUpdateModal()">Cancelar</button>
                <button class="btn btn-success" onclick="submitUpdateBook()">Salvar Alterações</button>
            </div>
        </div>
    </div>
    <div id="update-author-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color: var(--primary); margin-bottom: 0.5rem;">Atualizar Autor</h3>

            <input type="hidden" id="upd-author-id">

            <div class="input-group">
                <label>Nome do Autor</label>
                <input type="text" id="upd-author-name">
            </div>

            <div class="modal-actions">
                <button class="btn" style="background: #64748b;" onclick="closeUpdateAuthorModal()">Cancelar</button>
                <button class="btn btn-success" onclick="submitUpdateAuthor()">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
